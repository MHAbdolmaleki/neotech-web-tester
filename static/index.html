<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تستر هوشمند جریان وب | NeoTech WebPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400">🚀 NeoTech WebPulse AI Tester</h1>
            <span class="text-sm text-slate-400">تیم: NeoTech | توسعه‌دهنده: محمدحسین عبدالمالکی</span>
        </div>
    </header>

    <main class="container mx-auto p-6 max-w-4xl flex-grow">
        <div id="auth-section" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl mb-6">
            <h2 class="text-lg font-semibold mb-4 text-indigo-400">ورود / ثبت‌نام در سامانه</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="username" placeholder="نام کاربری" class="bg-slate-900 border border-slate-700 rounded p-2 text-white">
                <input type="password" id="password" placeholder="رمز عبور" class="bg-slate-900 border border-slate-700 rounded p-2 text-white">
            </div>
            <div class="mt-4 flex gap-4">
                <button onclick="register()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded font-medium transition">ثبت‌نام</button>
                <button onclick="login()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-medium transition">ورود به سیستم</button>
            </div>
            <p id="auth-msg" class="mt-2 text-sm text-yellow-400"></p>
        </div>

        <div id="test-section" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl opacity-50 pointer-events-none transition">
            <h2 class="text-lg font-semibold mb-4 text-emerald-400">شروع تست خودکار جریان وب (ایجنتیک)</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">آدرس سایت هدف (Target URL):</label>
                    <input type="url" id="target_url" placeholder="https://example.com/signup" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">هدف تست (مثلاً بررسی فرم ثبت‌نام یا سبد خرید):</label>
                    <textarea id="test_objective" rows="3" placeholder="جریان ثبت نام را تست کن و گزارش شکست فرم‌ها را بده" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></textarea>
                </div>
                <button onclick="runTest()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded font-bold transition">اجرای ایجنت تست</button>
            </div>
            <div id="result-box" class="mt-6 hidden bg-slate-900 p-4 rounded border border-slate-700 font-mono text-sm text-emerald-300 whitespace-pre-wrap"></div>
        </div>
    </main>

    <footer class="bg-slate-800 text-center p-4 text-xs text-slate-500 border-t border-slate-700">
        ساخته شده برای مسابقه BuildX | تیم نئوتک (NeoTech)
    </footer>

    <script>
        let authToken = "";

        async function register() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            document.getElementById('auth-msg').innerText = data.message || data.detail;
        }

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if(res.ok) {
                authToken = data.token;
                document.getElementById('auth-msg').innerText = "ورود موفقیت‌آمیز بود! بخش تست فعال شد.";
                document.getElementById('test-section').classList.remove('opacity-50', 'pointer-events-none');
            } else {
                document.getElementById('auth-msg').innerText = data.detail;
            }
        }

        async function runTest() {
            const url = document.getElementById('target_url').value;
            const obj = document.getElementById('test_objective').value;
            const resBox = document.getElementById('result-box');
            
            resBox.classList.remove('hidden');
            resBox.innerText = "⏳ ایجنت در حال اجرای تست و بررسی صفحات است...";

            const res = await fetch('/api/run-test', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target_url: url, test_objective: obj})
            });
            const data = await res.json();
            resBox.innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
